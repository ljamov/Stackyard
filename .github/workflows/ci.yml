name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build interface
        run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build app (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build desktop app
        run: npx tauri build --debug --no-bundle
      - name: Build CLI
        run: cargo build -p stackyard-cli
      - name: Core tests on this OS
        run: cargo test -p stackyard-core
      - name: Live checks (real downloads, services started for real)
        env:
          STACKYARD_GITHUB_TOKEN: ${{ github.token }}
        run: cargo test -p stackyard-core -- --ignored live_ --nocapture

  sites:
    name: Local sites end to end (${{ matrix.os }})
    needs: check
    # A hung step fails the job instead of holding a runner for six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STACKYARD_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p stackyard-cli
      - name: Prepare
        shell: bash
        run: |
          echo "STACKYARD_HOME=$RUNNER_TEMP/stackyard" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/code/hello" "$RUNNER_TEMP/code/php-app"
          echo '<h1>Hello from Stackyard</h1>' > "$RUNNER_TEMP/code/hello/index.html"
          echo '<?php echo "PHP ", PHP_VERSION;' > "$RUNNER_TEMP/code/php-app/index.php"
      - name: Install Caddy, park a folder of projects
        shell: bash
        run: |
          stackyard services install caddy
          # PHP builds for macOS and Linux are not published yet.
          if [ "$RUNNER_OS" = Windows ]; then stackyard runtimes install php 8.4; fi
          stackyard sites park "$RUNNER_TEMP/code"
          stackyard sites
      - name: Serve, set up the system, open https://hello.stack
        shell: bash
        run: |
          set -euo pipefail
          home="$STACKYARD_HOME"
          log="$RUNNER_TEMP/up.log"
          if [ "$RUNNER_OS" = Windows ]; then
            curl() { /c/Windows/System32/curl.exe --ssl-no-revoke "$@"; }
          elif [ "$RUNNER_OS" = macOS ]; then
            curl() { /usr/bin/curl "$@"; }
          fi
          start() {
            stackyard up > "$log" 2>&1 &
            up=$!
            for _ in $(seq 60); do
              grep -q "Press Ctrl+C" "$log" && { cat "$log"; return 0; }
              sleep 1
            done
            cat "$log"; return 1
          }
          stop() {
            kill -INT "$up" 2>/dev/null || true
            sleep 3
            if [ "$RUNNER_OS" = Windows ]; then
              taskkill //F //IM stackyard.exe //IM caddy.exe //IM php-cgi.exe 2>/dev/null || true
            fi
            wait "$up" 2>/dev/null || true
          }
          https_port() { sed -n 's/^https = //p' "$home/config/caddy/ports.toml"; }
          trap 'cat "$log"; tail -n 30 "$home/logs/caddy.log" || true' ERR

          suffix() { p=$(https_port); [ "$p" = 443 ] && echo "" || echo ":$p"; }
          # Caddy makes each site's certificate just after it starts, and a
          # request before that fails the TLS handshake, so wait for it.
          page() { for _ in $(seq 30); do curl -fsS "$@" >/dev/null 2>&1 && break; sleep 1; done; curl -fsS "$@"; }

          echo "== .localhost works before setup, and the first start makes the certificate"
          start
          for _ in $(seq 30); do [ -f "$home/data/caddy/pki/authorities/local/root.crt" ] && break; sleep 1; done
          page -k "https://hello.localhost:$(https_port)/" | grep "Hello from Stackyard"
          stop

          if [ "$RUNNER_OS" = macOS ]; then
            # Trusting a certificate on macOS needs someone at the screen,
            # which a CI runner does not have; set up local names only.
            rm -rf "$home/data/caddy/pki"
            stackyard system setup --print
            stackyard system setup
            start
            page -k "https://hello.stack$(suffix)/" | grep "Hello from Stackyard"
            stop
            exit 0
          fi

          echo "== System setup"
          stackyard system setup --print
          stackyard system setup
          stackyard system | tee "$RUNNER_TEMP/status.txt"
          grep -q "are set up" "$RUNNER_TEMP/status.txt"

          echo "== Real domain, trusted certificate"
          start
          if [ "$RUNNER_OS" = Linux ]; then [ "$(https_port)" = 443 ]; fi
          page "https://hello.stack$(suffix)/" | grep "Hello from Stackyard"
          if [ "$RUNNER_OS" = Windows ]; then
            page "https://php-app.stack$(suffix)/" | grep "PHP 8.4"
          fi
          stop
      - name: Background service shared by every stackyard command
        shell: bash
        # A background service that kept the caller's pipes open would hang here.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            curl() { /c/Windows/System32/curl.exe --ssl-no-revoke "$@"; }
          elif [ "$RUNNER_OS" = macOS ]; then
            curl() { /usr/bin/curl "$@"; }
          fi
          trap 'tail -n 30 "$STACKYARD_HOME/logs/daemon.log" "$STACKYARD_HOME/logs/caddy.log" || true' ERR
          stackyard status | grep -q "Nothing is running"

          echo "== start runs the web server in the background and returns"
          stackyard start caddy
          stackyard status | tee "$RUNNER_TEMP/status.txt"
          grep -q "in the background" "$RUNNER_TEMP/status.txt"
          grep -Eq "Caddy +running" "$RUNNER_TEMP/status.txt"
          port=$(sed -n 's/^https = //p' "$STACKYARD_HOME/config/caddy/ports.toml")
          page() { curl -fsSk --max-time 5 "https://$1.localhost:$port/"; }
          for _ in $(seq 30); do page hello >/dev/null 2>&1 && break; sleep 1; done
          page hello | grep "Hello from Stackyard"

          echo "== a site added from another command is served right away"
          mkdir -p "$RUNNER_TEMP/later"
          echo '<p>Added later</p>' > "$RUNNER_TEMP/later/index.html"
          stackyard sites add later --path "$RUNNER_TEMP/later" --static
          for _ in $(seq 30); do page later 2>/dev/null | grep -q "Added later" && break; sleep 1; done
          page later | grep "Added later"
          stackyard logs caddy -n 5

          echo "== a site with an empty folder says where its start page goes"
          mkdir -p "$RUNNER_TEMP/empty"
          stackyard sites add empty --path "$RUNNER_TEMP/empty" --static
          for _ in $(seq 30); do page empty 2>/dev/null | grep -q "has no index.php" && break; sleep 1; done
          page empty | grep "has no index.php"

          echo "== stop ends everything"
          stackyard stop
          sleep 2
          stackyard status | grep -q "Nothing is running"
          if page hello >/dev/null 2>&1; then echo "still serving after stop"; exit 1; fi

          echo "== AI tools over MCP: reading is always on, actions only once allowed"
          # grep without -q reads to the end, so the command before it never writes into a closed pipe.
          stackyard modules on mcp
          mkdir -p "$RUNNER_TEMP/ai-site"
          echo '<p>Made by an AI tool</p>' > "$RUNNER_TEMP/ai-site/index.html"
          folder="$RUNNER_TEMP/ai-site"
          if [ "$RUNNER_OS" = Windows ]; then folder=$(cygpath -m "$folder"); fi
          init='{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          call() { printf '{"jsonrpc":"2.0","id":%s,"method":"tools/call","params":{"name":"%s","arguments":%s}}' "$1" "$2" "$3"; }
          session() { printf '%s\n' "$init" "$@" | stackyard mcp | tee "$RUNNER_TEMP/mcp.out"; }
          answer() { grep "^{\"id\":$1," "$RUNNER_TEMP/mcp.out"; }
          session "$(call 1 start_service '{"service":"caddy"}')" '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          answer 1 | grep 'stackyard mcp allow start_service' >/dev/null
          answer 2 | grep list_sites >/dev/null
          if answer 2 | grep start_service >/dev/null; then echo "an action was offered before it was allowed"; exit 1; fi
          stackyard status | grep "Nothing is running" >/dev/null

          stackyard mcp allow all
          site=$(printf '{"name":"ai-made","folder":"%s","runtime":"static"}' "$folder")
          session \
            "$(call 1 create_site "$site")" \
            "$(call 2 start_service '{"service":"caddy"}')" \
            "$(call 3 list_sites '{}')" \
            "$(call 4 read_logs '{"service":"caddy","lines":5}')"
          for id in 1 2 3 4; do answer $id | grep '"isError":false'; done >/dev/null
          answer 3 | grep 'ai-made.stack' >/dev/null
          stackyard status | grep -E "Caddy +running" >/dev/null
          port=$(sed -n 's/^https = //p' "$STACKYARD_HOME/config/caddy/ports.toml")
          for _ in $(seq 30); do page ai-made 2>/dev/null | grep "Made by an AI tool" && break; sleep 1; done >/dev/null
          page ai-made | grep "Made by an AI tool"

          session "$(call 1 stop_service '{"service":"caddy"}')"
          answer 1 | grep '"state":"stopped"' >/dev/null
          stackyard mcp log | tee "$RUNNER_TEMP/mcp-log.txt"
          grep -Eq "ci +start_service +caddy +ok" "$RUNNER_TEMP/mcp-log.txt"
          stackyard stop

          echo "== the log viewer lists every log"
          stackyard logs | tee "$RUNNER_TEMP/logs.txt"
          grep -E "^caddy +Caddy" "$RUNNER_TEMP/logs.txt"
          grep -E "^daemon +Background service" "$RUNNER_TEMP/logs.txt"

          echo "== scheduled tasks run by hand, and on schedule in the background service"
          stackyard modules on scheduler
          tasks="$RUNNER_TEMP/task-dir"
          mkdir -p "$tasks"
          if [ "$RUNNER_OS" = Windows ]; then tasks=$(cygpath -m "$tasks"); fi
          stackyard tasks add "Write marker" --run "echo ran-here> marker.txt" --every "* * * * *" --in "$tasks"
          stackyard tasks run "write marker"
          grep ran-here "$tasks/marker.txt"
          rm "$tasks/marker.txt"
          stackyard start caddy
          for _ in $(seq 100); do [ -f "$tasks/marker.txt" ] && break; sleep 1; done
          grep ran-here "$tasks/marker.txt"
          # The marker can appear while the run is still being recorded.
          for _ in $(seq 20); do stackyard tasks | grep -q "last run" && break; sleep 1; done
          stackyard tasks | tee "$RUNNER_TEMP/tasks.txt"
          grep "last run" "$RUNNER_TEMP/tasks.txt" >/dev/null
          id=$(head -n 1 "$RUNNER_TEMP/tasks.txt" | cut -d " " -f 1)
          stackyard logs "task-$id" -n 5 | tee "$RUNNER_TEMP/task-log.txt"
          grep "started on schedule" "$RUNNER_TEMP/task-log.txt" >/dev/null
          stackyard logs | grep -E "^task-$id +Task: Write marker" >/dev/null
          stackyard stop

  terminal:
    name: Terminal commands end to end (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      STACKYARD_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI
        run: cargo build -p stackyard-cli
      - name: Prepare
        shell: bash
        run: |
          echo "STACKYARD_HOME=$RUNNER_TEMP/stackyard" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/code/old/src" "$RUNNER_TEMP/code/new"
      - name: Install Node 22 and 20, and PHP
        shell: bash
        run: |
          set -euo pipefail
          stackyard runtimes install node 22
          stackyard runtimes install node 20
          if [ "$RUNNER_OS" = Windows ]; then
            stackyard runtimes install php 8.4
          elif [ "$RUNNER_OS" = Linux ]; then
            # PHP builds for Linux are not published yet: stand in the
            # runner's own PHP as an installed 8.3.
            dir="$STACKYARD_HOME/runtimes/php/8.3"
            mkdir -p "$dir/bin"
            ln -s "$(command -v php)" "$dir/bin/php"
            printf 'release = "8.3.0"\nurl = "https://example.com/php.tar.gz"\nchecksum = "%064d"\n' 0 > "$dir/.stackyard-install.toml"
            stackyard modules on mariadb
            stackyard services install mariadb
          fi
          stackyard runtimes
      - name: Turn the commands on
        shell: bash
        run: |
          set -euo pipefail
          stackyard shims on --print
          stackyard shims on
          stackyard shims | tee "$RUNNER_TEMP/shims.txt"
          grep -q "On your PATH" "$RUNNER_TEMP/shims.txt"
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "[Environment]::GetEnvironmentVariable('Path', 'User')" | tee "$RUNNER_TEMP/path.txt"
            grep -qF 'stackyard\bin' "$RUNNER_TEMP/path.txt"
          fi
      - name: Each project gets its own version
        shell: bash
        run: |
          set -euo pipefail
          code="$RUNNER_TEMP/code"
          if [ "$RUNNER_OS" = Windows ]; then
            # A new terminal reads the user Path; this one was started
            # before, so add the folder by hand.
            export PATH="$(cygpath -u "$STACKYARD_HOME/bin"):$PATH"
            raw() { (cd "$1" && eval "$2"); }
          else
            # A new terminal's shell reads the start-up files `shims on` changed.
            raw() { "$SHELL" -ic "cd '$1' && $2" 2>/dev/null; }
          fi
          run() { raw "$@" | tail -n 1; }
          (cd "$code/old" && stackyard use node 20)

          echo "== node follows the nearest .stackyard file, else the default"
          [[ "$(run "$code/old/src" 'node -v')" == v20.* ]]
          [[ "$(run "$code/new" 'node -v')" == v22.* ]]
          [[ "$(run "$code/old" 'npm -v')" =~ ^[0-9]+\. ]]
          [[ "$(run "$code/new" 'npx --version')" =~ ^[0-9]+\. ]]
          status=0; raw "$code/old" 'node -e "process.exit(3)"' || status=$?
          [ "$status" -eq 3 ]
          (cd "$code/old/src" && stackyard which)

          if [ "$RUNNER_OS" != macOS ]; then
            echo "== php and composer"
            run "$code/new" 'php -r "echo PHP_VERSION;"'
            run "$code/new" 'composer --version' | grep -i composer
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            echo "== the database client"
            run "$code/new" 'mysql --version' | grep -i mariadb
          fi
      - name: Sites made from starters
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            curl() { /c/Windows/System32/curl.exe --ssl-no-revoke "$@"; }
          elif [ "$RUNNER_OS" = macOS ]; then
            curl() { /usr/bin/curl "$@"; }
          fi
          trap 'tail -n 40 "$STACKYARD_HOME/logs/starter.log" "$STACKYARD_HOME/logs/dev-docs.log" 2>/dev/null || true' ERR
          made="$RUNNER_TEMP/made"

          echo "== Astro, with the dev server Stackyard runs"
          stackyard sites new docs astro --path "$made/docs"
          [ -f "$made/docs/package.json" ] && [ -d "$made/docs/node_modules/astro" ]
          stackyard services install caddy
          stackyard start caddy
          port=$(sed -n 's/^https = //p' "$STACKYARD_HOME/config/caddy/ports.toml")
          for _ in $(seq 60); do curl -fsSk --max-time 5 "https://docs.localhost:$port/" 2>/dev/null | grep -qi astro && break; sleep 2; done
          curl -fsSk --max-time 5 "https://docs.localhost:$port/" | grep -i astro
          stackyard stop
          echo "== a starter refuses a folder that has files"
          if stackyard sites new docs2 astro --path "$made/docs"; then echo "made over existing files"; exit 1; fi

          if [ "$RUNNER_OS" != macOS ]; then
            echo "== Laravel, made with Composer"
            stackyard sites new shop laravel --path "$made/shop"
            [ -f "$made/shop/artisan" ] && [ -f "$made/shop/.env" ] && [ -d "$made/shop/vendor" ]
            stackyard sites | grep -q "shop"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            echo "== WordPress, with its database"
            stackyard sites new blog wordpress --path "$made/blog"
            grep -q "'DB_NAME', 'blog'" "$made/blog/wp-config.php"
            [ -f "$made/blog/wp-load.php" ]
            stackyard db | grep -q "blog"
            echo "== the WordPress tab's tools on it, with WooCommerce"
            STACKYARD_TEST_WP="$made/blog" cargo test -p stackyard-core -- --ignored wordpress_tools_on_a_real_site
            echo "== stagings of it: made from it and from each other, snapshots, trash"
            STACKYARD_TEST_STAGING=blog.stack cargo test -p stackyard-core -- --ignored stagings_of_a_real_site
            echo "== clone it back from a stand-in live server: SSH, FTP and the site over HTTP"
            sudo apt-get install -y --no-install-recommends openssh-server vsftpd >/dev/null
            sudo useradd -m -s /bin/bash live
            echo 'live:Live-pass-1' | sudo chpasswd
            sudo cp -a "$made/blog" /home/live/public_html
            sudo rm -f /home/live/public_html/wp-content/mu-plugins/stackyard.php
            sudo chown -R live:live /home/live
            bin=$(ls -d "$STACKYARD_HOME"/services/mariadb/*/bin | head -n 1)
            dbport=$(cut -d, -f1 "$STACKYARD_HOME/config/mariadb/ports" 2>/dev/null || echo 3306)
            sql() { "$bin/mariadb" -h 127.0.0.1 -P "$dbport" -u root "$@"; }
            sql -e "CREATE DATABASE live_blog; CREATE USER 'liveuser'@'%' IDENTIFIED BY 'Live-pass-1'; GRANT ALL ON live_blog.* TO 'liveuser'@'%';"
            "$bin/mariadb-dump" -h 127.0.0.1 -P "$dbport" -u root blog | sql live_blog
            sql live_blog -e "UPDATE wp_options SET option_value = 'http://127.0.0.1:8099' WHERE option_name IN ('home', 'siteurl')"
            sudo sed -i -e "s/'DB_NAME', 'blog'/'DB_NAME', 'live_blog'/" -e "s/'DB_USER', 'root'/'DB_USER', 'liveuser'/" \
              -e "s/'DB_PASSWORD', ''/'DB_PASSWORD', 'Live-pass-1'/" /home/live/public_html/wp-config.php
            # sshd and vsftpd only read config files owned by root.
            printf 'Port 2222\nListenAddress 127.0.0.1\nPasswordAuthentication yes\nKbdInteractiveAuthentication no\nUsePAM yes\nSubsystem sftp internal-sftp\nPidFile /tmp/sshd-live.pid\n' | sudo tee /etc/ssh/sshd-live.conf >/dev/null
            sudo mkdir -p /run/sshd && sudo ssh-keygen -A >/dev/null && sudo /usr/sbin/sshd -f /etc/ssh/sshd-live.conf
            printf 'listen=YES\nlisten_address=127.0.0.1\nlisten_port=2121\nanonymous_enable=NO\nlocal_enable=YES\nwrite_enable=YES\npasv_min_port=40000\npasv_max_port=40100\nseccomp_sandbox=NO\nbackground=YES\npam_service_name=vsftpd\n' | sudo tee /etc/vsftpd-live.conf >/dev/null
            sudo /usr/sbin/vsftpd /etc/vsftpd-live.conf
            sudo -u live bash -c 'cd /home/live/public_html && nohup php -S 127.0.0.1:8099 >/tmp/live-php.log 2>&1 &'
            for _ in $(seq 20); do curl -fs -o /dev/null http://127.0.0.1:8099/ && break; sleep 1; done
            (cd /home/live && sudo zip -qr "$RUNNER_TEMP/live-files.zip" public_html -x 'public_html/wp-content/uploads/*')
            "$bin/mariadb-dump" -h 127.0.0.1 -P "$dbport" -u root live_blog | gzip > "$RUNNER_TEMP/live_blog.sql.gz"
            STACKYARD_TEST_LIVE="sftp|127.0.0.1|2222|live|Live-pass-1|http://127.0.0.1:8099|2121" \
              STACKYARD_TEST_BACKUP="$RUNNER_TEMP/live-files.zip|$RUNNER_TEMP/live_blog.sql.gz" \
              cargo test -p stackyard-core -- --ignored clone_from_a_live_server
            stackyard stop
          fi
      - name: Python and Go sites, with the servers Stackyard runs
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Windows ]; then
            curl() { /c/Windows/System32/curl.exe --ssl-no-revoke "$@"; }
            venv=.venv/Scripts
          else
            venv=.venv/bin
          fi
          trap 'tail -n 40 "$STACKYARD_HOME"/logs/dev-*.log 2>/dev/null || true' ERR
          stackyard modules on python
          stackyard modules on go
          stackyard runtimes install python 3.13
          stackyard runtimes install go 1.26
          bin="$STACKYARD_HOME/bin"
          apps="$RUNNER_TEMP/apps"
          mkdir -p "$apps/flaskapp" "$apps/goapp"

          echo "== the commands run Stackyard's versions"
          "$bin/python" --version | grep -q "Python 3.13"
          "$bin/pip" --version
          "$bin/go" version | grep -q "go1.26"

          echo "== a Flask app in its own virtual environment"
          cd "$apps/flaskapp"
          "$bin/python" -m venv .venv
          "$venv/python" -m pip install --quiet flask
          printf 'flask\n' > requirements.txt
          printf 'from flask import Flask\napp = Flask(__name__)\n\n@app.get("/")\ndef home():\n    return "hello from flask"\n' > app.py

          echo "== a Go app that reads PORT"
          cd "$apps/goapp"
          printf 'module goapp\n\ngo 1.26\n' > go.mod
          printf 'package main\n\nimport (\n\t"fmt"\n\t"net/http"\n\t"os"\n)\n\nfunc main() {\n\thttp.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) { fmt.Fprint(w, "hello from go") })\n\tpanic(http.ListenAndServe("127.0.0.1:"+os.Getenv("PORT"), nil))\n}\n' > main.go

          if [ "$RUNNER_OS" = Linux ]; then
            # The stand-in PHP above has no php-fpm, so the web server could
            # not start with the PHP sites made from starters.
            stackyard sites remove shop
            stackyard sites remove blog
          fi
          stackyard sites add flaskapp --path "$apps/flaskapp"
          stackyard sites add goapp --path "$apps/goapp"
          stackyard sites | tee "$RUNNER_TEMP/sites.txt"
          grep -q "Flask" "$RUNNER_TEMP/sites.txt"
          stackyard start caddy
          port=$(sed -n 's/^https = //p' "$STACKYARD_HOME/config/caddy/ports.toml")
          for site in "flaskapp:hello from flask" "goapp:hello from go"; do
            name=${site%%:*}; text=${site#*:}
            for _ in $(seq 60); do curl -fsSk --max-time 5 "https://$name.localhost:$port/" 2>/dev/null | grep -q "$text" && break; sleep 2; done
            curl -fsSk --max-time 5 "https://$name.localhost:$port/" | grep "$text"
          done
          stackyard stop
      - name: Turn the commands off
        shell: bash
        run: |
          set -euo pipefail
          stackyard shims off
          stackyard shims | grep -q "are off"
          [ ! -e "$STACKYARD_HOME/bin/node" ] && [ ! -e "$STACKYARD_HOME/bin/node.exe" ]
          if [ "$RUNNER_OS" != Windows ]; then
            ! grep -q stackyard ~/.bashrc ~/.zshrc ~/.bash_profile ~/.profile 2>/dev/null
          fi
      - name: Clean up what nothing uses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STACKYARD_HOME/downloads"
          echo partial > "$STACKYARD_HOME/downloads/old.tar.xz"
          touch -t 202001010000 "$STACKYARD_HOME/downloads/old.tar.xz"
          stackyard cleanup | tee "$RUNNER_TEMP/cleanup.txt"
          # Node 20 is pinned in a folder that is not a site, so nothing Stackyard knows uses it.
          grep -q "runtime-node-20" "$RUNNER_TEMP/cleanup.txt"
          ! grep -q "runtime-node-22" "$RUNNER_TEMP/cleanup.txt"
          stackyard cleanup --recommended runtime-node-20
          [ ! -e "$STACKYARD_HOME/downloads/old.tar.xz" ]
          [ ! -e "$STACKYARD_HOME/runtimes/node/20" ]
          [ -e "$STACKYARD_HOME/runtimes/node/22" ]
