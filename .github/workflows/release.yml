name: Installers

# Installers for Windows, macOS and Linux. They run for version tags (and
# then go on a draft release), by hand, for every change to master, and for
# pull requests that change how the installers are made. Each build is
# installed and started on its own system, and checked against the
# performance budgets (size, start time, tray-only memory). Run by hand on master with
# "release" ticked, they also go on a draft release, tagged with the
# version in tauri.conf.json; the tag is made when the draft is published.
#
# With the TAURI_SIGNING_PRIVATE_KEY secret (and its _PASSWORD) set, each
# build also signs an update, and the release gets a latest.json that the
# app checks. Publishing the draft release is what makes the update reach
# people. Releases go to the STACKYARD_RELEASES_REPO variable's repository
# (with the STACKYARD_RELEASES_TOKEN secret) when set, else to this one;
# the app can only download updates from a public repository.
#
# Installers are signed when the signing secrets exist (see docs/signing.md)
# and built unsigned otherwise:
# - Windows, with Azure Artifact Signing: the AZURE_TENANT_ID, AZURE_CLIENT_ID
#   and AZURE_CLIENT_SECRET secrets, and the AZURE_SIGNING_ENDPOINT,
#   AZURE_SIGNING_ACCOUNT and AZURE_SIGNING_PROFILE variables.
# - macOS, with an Apple Developer ID: the APPLE_CERTIFICATE (the .p12 file
#   in base64) and APPLE_CERTIFICATE_PASSWORD secrets; with APPLE_ID,
#   APPLE_PASSWORD (an app-specific password) and APPLE_TEAM_ID also set,
#   the app is notarized too.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Put the installers on a draft release (master only)
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.release.conf.json
      - src-tauri/src/perf.rs
      - .github/scripts/**

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASES_REPO: ${{ vars.STACKYARD_RELEASES_REPO || github.repository }}
  # Performance budgets from the spec: installers stay under 15 MB, the
  # window loads within a second, and with the window closed the app uses
  # under 40 MB of memory.
  MAX_INSTALLER_MB: 15
  MAX_START_MS: 1000
  MAX_TRAY_MB: 40
  # The Microsoft client that lets signtool use Azure Artifact Signing.
  ARTIFACT_SIGNING_CLIENT: 1.0.128

jobs:
  bundle:
    name: Installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported Ubuntu, so the packages run on more systems.
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ACCOUNT != '' }}
      MAC_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
      MAC_NOTARIZING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev patchelf file xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Build the stackyard command to ship next to the app
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked -p stackyard-cli --target ${{ matrix.target }}
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.target }}/release/stackyard$ext" "src-tauri/binaries/stackyard-${{ matrix.target }}$ext"
      - name: Prepare Windows signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        shell: bash
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/artifact-signing"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/client.zip" \
            "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$ARTIFACT_SIGNING_CLIENT/microsoft.artifactsigning.client.$ARTIFACT_SIGNING_CLIENT.nupkg"
          unzip -q "$dir/client.zip" -d "$dir/client"
          jq -n --arg e "$ENDPOINT" --arg a "$ACCOUNT" --arg p "$PROFILE" \
            '{Endpoint: $e, CodeSigningAccountName: $a, CertificateProfileName: $p}' > "$dir/metadata.json"
          win() { cygpath -w "$1"; }
          echo "SIGNING_DLIB=$(win "$dir/client/bin/x64/Azure.CodeSigning.Dlib.dll")" >> "$GITHUB_ENV"
          echo "SIGNING_METADATA=$(win "$dir/metadata.json")" >> "$GITHUB_ENV"
          jq -n --arg s "$(win "$GITHUB_WORKSPACE/.github/scripts/sign-windows.ps1")" \
            '{bundle: {windows: {signCommand: {cmd: "powershell", args: ["-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $s, "%1"]}}}}' \
            > "$dir/sign.conf.json"
          echo "SIGN_CONFIG=$dir/sign.conf.json" >> "$GITHUB_ENV"
          cat "$dir/metadata.json" "$dir/sign.conf.json"
      - name: Prepare macOS signing
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Tauri signs with the certificate's name, read from the certificate
          # itself unless the APPLE_SIGNING_IDENTITY secret gives it.
          identity="$APPLE_SIGNING_IDENTITY"
          if [ -z "$identity" ]; then
            p12="$RUNNER_TEMP/certificate.p12"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
            for legacy in "" -legacy; do
              identity=$(openssl pkcs12 $legacy -in "$p12" -nokeys -passin env:APPLE_CERTIFICATE_PASSWORD 2>/dev/null |
                openssl x509 -noout -subject -nameopt multiline 2>/dev/null | sed -n 's/^ *commonName *= //p' || true)
              [ -n "$identity" ] && break
            done
            rm -f "$p12"
          fi
          [ -n "$identity" ] || { echo "::error::could not read the certificate's name; check APPLE_CERTIFICATE_PASSWORD"; exit 1; }
          echo "Signing as: $identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build the installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Tauri takes a variable that is there but empty (a secret that
          # was never added) as a request to sign; leave those out.
          for v in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v:-}" ] || unset "$v"
          done
          if [ "$MAC_NOTARIZING" != true ]; then unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; fi
          configs=(--config src-tauri/tauri.release.conf.json)
          if [ -n "${SIGN_CONFIG:-}" ]; then
            configs+=(--config "$SIGN_CONFIG")
          elif [ "$RUNNER_OS" != Linux ] && [ "$MAC_SIGNING" != true ]; then
            echo "No code signing secrets: building unsigned installers."
          fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ -z "$(jq -r '.plugins.updater.pubkey // ""' src-tauri/tauri.conf.json)" ]; then
              echo "::warning::Updates are signed, but tauri.conf.json has no public key, so the app can't check them"
            fi
            printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"endpoints":["https://github.com/%s/releases/latest/download/latest.json"]}}}' \
              "$RELEASES_REPO" > "$RUNNER_TEMP/updates.conf.json"
            configs+=(--config "$RUNNER_TEMP/updates.conf.json")
          else
            echo "No signing key: building installers without updates."
          fi
          npx tauri build --target ${{ matrix.target }} "${configs[@]}"
      # An update signed with a key that doesn't match the app's public
      # key would never install, so the pair is checked before release.
      - name: Check updates are signed with the app's key
        if: runner.os == 'Linux'
        shell: bash
        env:
          SIGNED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != true ]; then echo "No signing key: nothing to check."; exit 0; fi
          python3 -m pip install --quiet cryptography
          sig=$(find target/${{ matrix.target }}/release/bundle -name '*.sig' | head -1)
          [ -n "$sig" ] || { echo "::error::the build made no update signature"; exit 1; }
          python3 .github/scripts/verify-update-signature.py src-tauri/tauri.conf.json "${sig%.sig}" "$sig"

      - name: Check the installers
        shell: bash
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          mkdir -p out
          find "$bundle" -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.sig' \) -exec cp {} out/ \;
          # The macOS update archive has the same name for both chips.
          if [ -f "$bundle/macos/Stackyard.app.tar.gz" ]; then
            version=$(jq -r .version src-tauri/tauri.conf.json)
            arch=${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x64' }}
            cp "$bundle/macos/Stackyard.app.tar.gz" "out/Stackyard_${version}_${arch}.app.tar.gz"
            cp "$bundle/macos/Stackyard.app.tar.gz.sig" "out/Stackyard_${version}_${arch}.app.tar.gz.sig"
            rm -f out/Stackyard.app.tar.gz.sig
          fi
          ls -l out
          [ -n "$(ls out)" ] || { echo "no installers were made"; exit 1; }

          echo "== the stackyard command ships next to the app, and installs"
          case "$RUNNER_OS" in
            macOS)
              app="$bundle/macos/Stackyard.app/Contents/MacOS"
              ls -l "$app"
              file "$app/stackyard" | grep -q "${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}"
              if [ "${{ matrix.target }}" = aarch64-apple-darwin ]; then "$app/stackyard" --version; fi ;;
            Linux)
              sudo apt-get install -y ./out/*.deb
              stackyard --version
              test -x /usr/bin/stackyard-app ;;
            Windows)
              # The setup program installs for this user without asking.
              ./out/*-setup.exe //S
              dir="$LOCALAPPDATA/Stackyard"
              for _ in $(seq 30); do [ -f "$dir/stackyard.exe" ] && break; sleep 1; done
              ls -l "$dir"
              "$dir/stackyard.exe" --version ;;
          esac

          echo "== signatures"
          if [ "$WINDOWS_SIGNING" = true ]; then
            for f in out/*-setup.exe out/*.msi "$LOCALAPPDATA/Stackyard/stackyard-app.exe" "$LOCALAPPDATA/Stackyard/stackyard.exe"; do
              status=$(powershell -NoProfile -Command "(Get-AuthenticodeSignature '$(cygpath -w "$f")').Status" | tr -d '\r')
              echo "$(basename "$f"): $status"
              [ "$status" = Valid ] || { echo "::error file=$(basename "$f")::$(basename "$f") is not signed ($status)"; exit 1; }
            done
          fi
          if [ "$MAC_SIGNING" = true ]; then
            codesign --verify --deep --strict --verbose=2 "$bundle/macos/Stackyard.app"
            codesign -dv "$bundle/macos/Stackyard.app/Contents/MacOS/stackyard" 2>&1 | grep -q "Authority=Developer ID Application" ||
              { echo "::error::the stackyard command inside the app is not signed"; exit 1; }
            if [ "$MAC_NOTARIZING" = true ]; then
              spctl --assess --type execute --verbose "$bundle/macos/Stackyard.app"
              xcrun stapler validate "$bundle/macos/Stackyard.app"
            fi
          fi

          echo "== sizes"
          {
            echo "### Installers for ${{ matrix.name }}"
            echo
            case "$RUNNER_OS" in
              Windows) [ "$WINDOWS_SIGNING" = true ] && echo "Signed with Azure Artifact Signing." || echo "Not signed (no Windows signing secrets)." ;;
              macOS) if [ "$MAC_NOTARIZING" = true ]; then echo "Signed and notarized."; elif [ "$MAC_SIGNING" = true ]; then echo "Signed, not notarized (no APPLE_ID secrets)."; else echo "Not signed (no Apple signing secrets)."; fi ;;
            esac
            echo
            echo "| File | Size |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in out/*; do
            case "$f" in *.sig) continue ;; esac
            bytes=$(wc -c < "$f")
            mb=$(awk "BEGIN { printf \"%.1f\", $bytes / 1048576 }")
            echo "| $(basename "$f") | $mb MB |" >> "$GITHUB_STEP_SUMMARY"
            echo "$(basename "$f"): $mb MB"
            # An AppImage carries its own copy of the system's web view
            # libraries, so it is far bigger by design; it is reported only.
            case "$f" in *.AppImage) continue ;; esac
            if [ "$bytes" -gt $((MAX_INSTALLER_MB * 1048576)) ]; then
              echo "::error file=$(basename "$f")::$(basename "$f") is $mb MB, over the $MAX_INSTALLER_MB MB budget"
              over=1
            fi
          done
          [ -z "${over:-}" ]
      - name: Start the installed app and check start time and memory
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) xvfb-run -a .github/scripts/perf-check.sh /usr/bin/stackyard-app ;;
            macOS) .github/scripts/perf-check.sh "target/${{ matrix.target }}/release/bundle/macos/Stackyard.app/Contents/MacOS/stackyard-app" ;;
            Windows) .github/scripts/perf-check.sh "$LOCALAPPDATA/Stackyard/stackyard-app.exe" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: stackyard-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/master')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.STACKYARD_RELEASES_TOKEN || github.token }}
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ACCOUNT != '' }}
      MAC_NOTARIZING: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src-tauri/tauri.conf.json
            CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Pick the release tag
        id: tag
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          fi
          # Publishing a draft made by hand creates its tag, which runs this
          # workflow again; that release already has its installers. Only a
          # published release counts (this address never returns drafts), so
          # an unpublished draft is rebuilt and replaced below.
          if gh api "repos/$RELEASES_REPO/releases/tags/$tag" >/dev/null 2>&1; then
            echo "::notice::$tag already has a release, so there is nothing to add."
            tag=""
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Take this version's notes from the changelog
        if: steps.tag.outputs.tag != ''
        run: |
          set -euo pipefail
          # The section headed "## <version>", which the app shows next to its Update button.
          awk -v v="${TAG#v}" '
            /^## / { if (found) exit; rest = substr($0, 4); if (index(rest, v) == 1) { after = substr(rest, length(v) + 1); if (after == "" || after ~ /^[ (-]/) found = 1 }; next }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          if [ -s notes.md ]; then
            cat notes.md
          else
            echo "::warning::CHANGELOG.md has no '## ${TAG#v}' section, so this release has no notes."
          fi
      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.tag != ''
        with:
          path: out
          merge-multiple: true
      - name: Describe the update for the app
        if: steps.tag.outputs.tag != ''
        run: |
          set -euo pipefail
          base="https://github.com/$RELEASES_REPO/releases/download/$TAG"
          platforms='{}'
          add() {
            [ -f "out/$2.sig" ] || return 0
            platforms=$(jq --arg k "$1" --arg u "$base/$2" --rawfile s "out/$2.sig" \
              '.[$k] = {url: $u, signature: ($s | sub("\\s+$"; ""))}' <<<"$platforms")
          }
          for f in out/*; do
            name=$(basename "$f")
            case "$name" in
              *_aarch64.app.tar.gz) add darwin-aarch64-app "$name"; add darwin-aarch64 "$name" ;;
              *_x64.app.tar.gz) add darwin-x86_64-app "$name"; add darwin-x86_64 "$name" ;;
              *-setup.exe) add windows-x86_64-nsis "$name"; add windows-x86_64 "$name" ;;
              *.msi) add windows-x86_64-msi "$name" ;;
              *.deb) add linux-x86_64-deb "$name" ;;
              *.rpm) add linux-x86_64-rpm "$name" ;;
              *.AppImage) add linux-x86_64-appimage "$name"; add linux-x86_64 "$name" ;;
            esac
          done
          rm -f out/*.sig
          if [ "$platforms" = '{}' ]; then
            echo "No signed updates in this build."
            exit 0
          fi
          jq -n --arg v "${TAG#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            --rawfile n notes.md '{version: $v, notes: ($n | sub("\\s+$"; "")), pub_date: $d, platforms: $p}' > out/latest.json
          cat out/latest.json
      - name: Put the installers on a draft release
        if: steps.tag.outputs.tag != ''
        run: |
          ls -l out
          # The commit only exists here, not in a separate releases repository.
          target=(); [ "$RELEASES_REPO" = "$GITHUB_REPOSITORY" ] && target=(--target "$GITHUB_SHA")
          # A rebuild replaces an earlier draft of the same version, so only
          # one draft is left to publish.
          gh api "repos/$RELEASES_REPO/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$RELEASES_REPO/releases/$id"
            done
          # Only what is still unsigned needs the way past the system's warning.
          hint=()
          [ "$MAC_NOTARIZING" = true ] || hint+=("macOS: right-click the app and choose Open the first time.")
          [ "$WINDOWS_SIGNING" = true ] || hint+=("Windows: choose More info, then Run anyway.")
          gh release create "$TAG" out/* --repo "$RELEASES_REPO" --draft "${target[@]}" \
            --title "Stackyard $TAG" \
            --notes-file <(cat notes.md; if [ ${#hint[@]} -gt 0 ]; then [ -s notes.md ] && echo; echo "Unsigned installers. ${hint[*]}"; fi)
