[package]
name = "stackyard-core"
description = "Core logic shared by the Stackyard app, CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
dirs = "6"
flate2 = "1"
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
tar = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
liblzma = { version = "0.4", features = ["static"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Time"] }
