[workspace]
resolver = "2"
members = ["crates/stackyard-core", "crates/stackyard-cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ljamov/Stackyard"

[workspace.dependencies]
stackyard-core = { path = "crates/stackyard-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
